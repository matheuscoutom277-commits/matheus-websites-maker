<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes - Matheus Websites</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f2f6;
        }
        .btn-voltar {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Clientes Cadastrados no Sistema</h1>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail / Telefone</th>
                </tr>
            </thead>
            <tbody id="tabela-clientes">
                <!-- Os dados do MySQL vão aparecer aqui automaticamente via JavaScript -->
            </tbody>
        </table>

        <a href="/" class="btn-voltar">← Voltar à página inicial</a>
    </div>

    <script>
        // Função para ir buscar os dados ao nosso servidor Node.js
        async function carregarClientes() {
            try {
                const resposta = await fetch('/clientes');
                const clientes = await resposta.json();

                const tbody = document.getElementById('tabela-clientes');
                tbody.innerHTML = ''; // Limpa a tabela antes de preencher

                // Passa por cada cliente vindo do MySQL e cria uma linha na tabela
                clientes.forEach(cliente => {
                    const linha = document.createElement('tr');
                    linha.innerHTML = `
                        <td>${cliente.id}</td>
                        <td>${cliente.nome || 'Não informado'}</td>
                        <td>${cliente.email || cliente.telefone || 'N/A'}</td>
                    `;
                    tbody.appendChild(linha);
                });
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
            }
        }

        // Executar a função assim que a página abrir
        carregarClientes();
    </script>

</body>
